name: Build and Upload Release Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 已发布的 Release 标签（例如 v1.3.0）
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set release tag
        id: vars
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.vars.outputs.tag }}
          persist-credentials: false

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          is_draft=$(gh release view --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft -- "$RELEASE_TAG")
          test "$is_draft" = false

      - name: Prepare folder structure
        run: |
          mkdir oauth-oidc
          find . -maxdepth 1 \
            -not -name '.' \
            -not -name 'oauth-oidc' \
            -not -name 'docs' \
            -not -name '.workbuddy' \
            -not -name '.git' \
            -not -name '.github' \
            -not -name '.gitignore' \
            -exec mv {} oauth-oidc/ \;

      - name: Create zip package
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          zip -r "OAuth-OIDC_${RELEASE_TAG//\//_}.zip" oauth-oidc

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: OAuth-OIDC_*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
